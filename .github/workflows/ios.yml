# Сборка Pocketcord для iPhone на облачном Mac (GitHub Actions).
# Результат — неподписанный Pocketcord.ipa во вкладке Actions → Artifacts.
# Ставится через Sideloadly / AltStore со своим Apple ID (бесплатная подпись — 7 дней).
name: iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust для iPhone
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Кэш Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # собираем под Apple-чип (готовая версия из интернета — для Intel и ломается под эмулятором);
      # после первой удачной сборки она берётся из кэша
      - name: Tauri CLI
        run: which cargo-tauri || cargo install tauri-cli --version "^2" --locked

      - name: Проект Xcode
        working-directory: src-tauri
        run: cargo tauri ios init --ci

      # Tauri собирает Rust изнутри Xcode только вместе с `tauri ios build` (а он требует платную подпись).
      # Поэтому собираем Rust-библиотеку заранее и подкладываем туда, где Xcode её ищет.
      - name: Rust-библиотека для iPhone
        working-directory: src-tauri
        run: |
          cargo build --release --lib --target aarch64-apple-ios
          for cfg in release Release; do
            mkdir -p gen/apple/Externals/arm64/$cfg
            cp target/aarch64-apple-ios/release/libpocketcord_lib.a gen/apple/Externals/arm64/$cfg/libapp.a
          done
          grep -n "LIBRARY_SEARCH_PATHS\|libapp" gen/apple/*.xcodeproj/project.pbxproj | head -20 || true
          # шаг «Build Rust Code» в Xcode больше не нужен
          perl -0pi -e 's/shellScript = "cargo tauri ios xcode-script.*?";\n/shellScript = "echo rust-prebuilt\\n";\n/s' gen/apple/*.xcodeproj/project.pbxproj
          grep -n "rust-prebuilt" gen/apple/*.xcodeproj/project.pbxproj | head -3

      - name: Сборка без подписи
        working-directory: src-tauri/gen/apple
        run: |
          PROJ=$(ls -d *.xcodeproj | head -1)
          SCHEME=$(xcodebuild -list -project "$PROJ" | awk '/Schemes:/{f=1;next} f&&NF{print $1; exit}')
          echo "project=$PROJ scheme=$SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" \
            -configuration release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Упаковка в .ipa
        working-directory: src-tauri/gen/apple
        run: |
          APP=$(find build/Build/Products -name "*.app" -type d | head -1)
          echo "app=$APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry ../../../Pocketcord.ipa Payload
          ls -lh ../../../Pocketcord.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Pocketcord-iOS
          path: Pocketcord.ipa
